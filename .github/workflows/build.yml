name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone executables
        run: |
          python build.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: dist/*.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Standalone Executables"
          body: |
            Automated build of standalone Windows executables.

            Download the `.exe` files below to run without Python installed:
            - **auto_clear_temp_folder.exe**: Cleans temporary files from `%TEMP%`.
            - **auto_clear_node_modules.exe**: Cleans `node_modules` and custom project caches.
          files: dist/*.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
